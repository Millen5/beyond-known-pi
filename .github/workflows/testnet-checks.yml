name: Testnet static-site checks

on:
  push:
    branches: [testnet-hosting]
  pull_request:
    branches: [testnet-hosting]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run static-site tests
        run: python -m unittest discover -s tests -v
