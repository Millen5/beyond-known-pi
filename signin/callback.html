<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#100c22">
<title>Pi Sign-In | BEYOND THE KNOWN</title>
<style>
:root{color-scheme:dark;--bg:#100c22;--panel:#211938;--gold:#ffc56a;--text:#f8f5ff;--muted:#c4bad8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 70% 15%,#7546aa55,transparent 50%),var(--bg);color:var(--text);font:16px/1.7 system-ui,sans-serif}
main{width:min(620px,100%);padding:clamp(24px,5vw,42px);border:1px solid #ffffff25;border-radius:22px;background:var(--panel)}
h1{font-size:clamp(1.8rem,6vw,2.7rem);line-height:1.15;margin:12px 0;color:var(--gold)}p{color:var(--muted)}
.notice{padding:14px 16px;border:1px solid #ffc56a55;border-radius:12px;background:#ffc56a12}
a{color:var(--gold)}.eyebrow{color:var(--gold);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
</style>
</head>
<body><main>
<div class="eyebrow">BEYOND THE KNOWN · PI ECOSYSTEM</div>
<h1 id="heading">Verifying Pi Sign-In…</h1>
<p id="status" class="notice" role="status" aria-live="polite">Checking your Pi authentication response securely.</p>
<p id="detail">Your access token is not stored in the page URL or browser storage.</p>
<p><a href="../index.html">← Return to BEYOND THE KNOWN</a></p>
</main>
<script>
(async()=>{
 const heading=document.getElementById("heading"),status=document.getElementById("status"),detail=document.getElementById("detail");
 const params=new URLSearchParams(location.hash.slice(1));
 const expected=sessionStorage.getItem("btk_pi_oauth_state");
 sessionStorage.removeItem("btk_pi_oauth_state");
 const returnedState=params.get("state");
 const token=params.get("access_token");
 const error=params.get("error");
 history.replaceState(null,"",location.pathname);
 if(!expected||!returnedState||returnedState!==expected){
   heading.textContent="Sign-In could not be verified";
   status.textContent="The security state did not match. Please start Pi Sign-In again.";
   return;
 }
 if(error){
   heading.textContent="Pi Sign-In was not completed";
   status.textContent="Pi returned: "+error+". You can return home and try again.";
   return;
 }
 if(!token||params.get("token_type")!=="Bearer"){
   heading.textContent="Sign-In response incomplete";
   status.textContent="The expected Pi access token was not provided.";
   return;
 }
 try{
   const response=await fetch("/api/pi/verify",{
     method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({accessToken:token}),credentials:"same-origin"
   });
   const data=await response.json();
   if(!response.ok||!data.verified||!data.user||!data.user.uid){
     throw new Error(data.error||"Pi could not verify this account.");
   }
   heading.textContent="Pi identity verified";
   status.textContent="Welcome"+(data.user.username?", "+data.user.username:"")+". Your secure sign-in session is active.";
   detail.textContent="Return to the homepage. Your session is held in a Secure, HttpOnly cookie and can be ended with Log out."
 }catch(e){
   heading.textContent="Verification unsuccessful";
   status.textContent=e.message||"The verification service could not confirm your Pi account.";
   detail.textContent="Please try again later. Never share your Pi Wallet passphrase.";
 }
})();
</script>
</body></html>
