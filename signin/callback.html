<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100c22">
  <title>Pi Sign-In Callback | BEYOND THE KNOWN</title>
  <style>
    :root{color-scheme:dark;--bg:#100c22;--panel:#211938;--gold:#ffc56a;--text:#f8f5ff;--muted:#c4bad8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 70% 15%,#7546aa55,transparent 50%),var(--bg);color:var(--text);font:16px/1.7 Manrope,system-ui,sans-serif}
    main{width:min(620px,100%);padding:clamp(24px,5vw,42px);border:1px solid #ffffff25;border-radius:22px;background:var(--panel);box-shadow:0 24px 80px #0005}
    .eyebrow{color:var(--gold);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
    h1{font-size:clamp(1.8rem,6vw,2.7rem);line-height:1.15;margin:12px 0}
    p{color:var(--muted)}
    a{color:var(--gold)}
    #status{padding:14px 16px;border:1px solid #ffffff25;border-radius:12px;background:#ffffff08;overflow-wrap:anywhere}
    .small{font-size:.88rem}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BEYOND THE KNOWN · PI ECOSYSTEM</div>
    <h1>Pi Sign-In</h1>
    <p id="status" role="status" aria-live="polite">Checking the sign-in response…</p>
    <p class="small"><a href="../index.html">Return to BEYOND THE KNOWN</a></p>
  </main>
  <script>
    (async function () {
      const status = document.getElementById("status");
      const params = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = params.get("access_token");
      const returnedState = params.get("state");
      const expectedState = sessionStorage.getItem("pi_oauth_state");
      const error = params.get("error");

      // Remove OAuth data from the visible URL as soon as it has been read.
      history.replaceState(null, document.title, window.location.pathname + window.location.search);

      if (error) {
        sessionStorage.removeItem("pi_oauth_state");
        status.textContent = "Pi sign-in was not completed: " + error.replace(/[^a-z0-9_-]/gi, "");
        return;
      }

      if (!accessToken) {
        status.textContent = "No access token was returned. Please start Pi Sign-In again.";
        return;
      }

      if (!expectedState || !returnedState || returnedState !== expectedState) {
        sessionStorage.removeItem("pi_oauth_state");
        status.textContent = "Sign-in could not be verified because the security state did not match. Please try again.";
        return;
      }

      sessionStorage.removeItem("pi_oauth_state");
      status.textContent = "Authorization received. Verifying your Pi account…";

      try {
        const response = await fetch("https://api.minepi.com/v2/me", {
          method: "GET",
          headers: { Authorization: "Bearer " + accessToken }
        });

        if (!response.ok) {
          throw new Error("Pi account verification returned HTTP " + response.status);
        }

        const user = await response.json();
        if (!user || !user.uid || !user.username) {
          throw new Error("The Pi API response did not contain the expected user identity.");
        }

        status.textContent = "Pi identity verified for @" + user.username + ". This is a sign-in proof only; protected accounts, memberships and payments are not enabled yet.";
      } catch (err) {
        status.textContent = "The authorization response was received, but account verification could not be completed. " + (err && err.message ? err.message : "Please try again.");
      }
    })();
  </script>
</body>
</html>
